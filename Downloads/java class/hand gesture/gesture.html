<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gesture Draw Web</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #060712;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #topBar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 12px;
      box-sizing: border-box;
      background: linear-gradient(90deg, #111827ee, #000000aa);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .chip {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      border: 2px solid #4b5563;
      box-shadow: 0 0 10px #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      position: relative;
    }
    .chip.selected {
      border-color: #facc15;
      box-shadow: 0 0 12px #facc15;
    }
    .chip span {
      font-size: 24px;
      font-weight: 700;
    }
    #status {
      position: absolute;
      left: 16px;
      bottom: 16px;
      padding: 8px 16px;
      background: #000000aa;
      border-radius: 999px;
      font-size: 14px;
      display: flex;
      gap: 12px;
    }
    #status span {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topBar">
      <div class="chip" data-color="0" style="background:#3b82f6;"></div>
      <div class="chip" data-color="1" style="background:#22c55e;"></div>
      <div class="chip" data-color="2" style="background:#ef4444;"></div>
      <div class="chip" data-shape="rect"><span>R</span></div>
      <div class="chip" data-shape="circle"><span>C</span></div>
      <div class="chip" data-shape="line"><span>L</span></div>
    </div>

    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="status">
      <span id="modeLabel">MODE: IDLE</span>
      <span id="fpsLabel">FPS: 0</span>
    </div>
  </div>

  <!-- MediaPipe Hands and drawing utils (CDN) [web:200][web:201] -->
  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const modeLabel = document.getElementById("modeLabel");
    const fpsLabel = document.getElementById("fpsLabel");
    const chips = Array.from(document.querySelectorAll(".chip"));

    let handLandmarker;
    let lastVideoTime = -1;
    let runningMode = "VIDEO";

    // state
    const colors = ["#3b82f6", "#22c55e", "#ef4444"];
    let colorIndex = 0;
    let shapeType = "rect";
    let shapes = [];
    let selectedIndex = -1;
    const defaultSize = 80;

    let lastFrameTime = performance.now();

    // basic utility
    function resizeCanvas() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    function drawCircle(x, y, r, color) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawShape(shape, highlight = false) {
      const { type, center, size, color, thickness } = shape;
      const [cx, cy] = center;
      ctx.strokeStyle = color;
      ctx.lineWidth = thickness;
      ctx.beginPath();
      if (type === "rect") {
        ctx.rect(cx - size, cy - size, size * 2, size * 2);
      } else if (type === "circle") {
        ctx.arc(cx, cy, size, 0, Math.PI * 2);
      } else if (type === "line") {
        ctx.moveTo(cx - size, cy);
        ctx.lineTo(cx + size, cy);
      }
      ctx.stroke();
      if (highlight) {
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(cx - size - 8, cy - size - 8, (size + 8) * 2, (size + 8) * 2);
        ctx.stroke();
      }
    }

    function pointInShape(pt, shape) {
      const [x, y] = pt;
      const { type, center, size } = shape;
      const [cx, cy] = center;
      if (type === "rect") {
        return Math.abs(x - cx) <= size && Math.abs(y - cy) <= size;
      }
      if (type === "circle") {
        const dx = x - cx;
        const dy = y - cy;
        return Math.sqrt(dx * dx + dy * dy) <= size;
      }
      if (type === "line") {
        return Math.abs(y - cy) <= 20 && Math.abs(x - cx) <= size;
      }
      return false;
    }

    function updateTopBarSelectionFromPoint(x, y) {
      const barRect = document.getElementById("topBar").getBoundingClientRect();
      const vx = (x / canvas.width) * barRect.width + barRect.left;
      const vy = (y / canvas.height) * barRect.height + barRect.top;

      const el = document.elementFromPoint(vx, vy);
      if (!el || !el.classList || !el.classList.contains("chip")) return;

      const colorAttr = el.getAttribute("data-color");
      const shapeAttr = el.getAttribute("data-shape");
      if (colorAttr !== null) {
        colorIndex = parseInt(colorAttr, 10);
      } else if (shapeAttr !== null) {
        shapeType = shapeAttr;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 + 50;
        shapes.push({
          type: shapeType,
          center: [cx, cy],
          size: defaultSize,
          color: colors[colorIndex],
          thickness: 5,
          baseDist: null
        });
        selectedIndex = shapes.length - 1;
      }

      chips.forEach(ch => ch.classList.remove("selected"));
      chips.forEach(ch => {
        if (ch.getAttribute("data-color") === String(colorIndex)) ch.classList.add("selected");
        if (ch.getAttribute("data-shape") === shapeType) ch.classList.add("selected");
      });
    }

    // load model [web:200][web:210]
    async function initHandLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
        },
        runningMode,
        numHands: 2
      });
    }

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvas();
          resolve();
        };
      });
    }

    async function predict() {
      if (!handLandmarker) return;

      const startTimeMs = performance.now();
      if (lastVideoTime === video.currentTime) {
        requestAnimationFrame(predict);
        return;
      }
      lastVideoTime = video.currentTime;

      const detections = handLandmarker.detectForVideo(video, startTimeMs);
      const hands = detections.landmarks || [];

      const now = performance.now();
      const dt = now - lastFrameTime;
      lastFrameTime = now;
      const fps = (1000 / dt).toFixed(1);
      fpsLabel.textContent = `FPS: ${fps}`;

      // clear canvas, draw shapes
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      shapes.forEach((sh, i) => drawShape(canvas, sh, i === selectedIndex));

      let mode = "IDLE";
      const indexPoints = [];

      // handle hands
      hands.forEach(hand => {
        const lm = hand;
        const idx = lm[8];
        const hx = idx.x * canvas.width;
        const hy = idx.y * canvas.height;
        indexPoints.push([hx, hy]);
        drawCircle(hx, hy, 8, "#22c55e");

        // quick top bar selection if near top
        if (hy < 100) {
          updateTopBarSelectionFromPoint(hx, hy);
          mode = "SELECT_BAR";
        }

        // shape hit selection: tap inside
        if (hy >= 100) {
          for (let i = shapes.length - 1; i >= 0; i--) {
            if (pointInShape([hx, hy], shapes[i])) {
              selectedIndex = i;
              mode = "SELECT_SHAPE";
              break;
            }
          }
        }
      });

      // two-hand control for selected shape
      if (selectedIndex !== -1 && indexPoints.length >= 2) {
        const [p1, p2] = [indexPoints[0], indexPoints[1]];
        const cx = (p1[0] + p2[0]) / 2;
        const cy = (p1[1] + p2[1]) / 2;
        const shp = shapes[selectedIndex];
        shp.center = [cx, cy];

        const dx = p1[0] - p2[0];
        const dy = p1[1] - p2[1];
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (!shp.baseDist && dist > 0) shp.baseDist = dist;
        if (shp.baseDist && dist > 0) {
          const scale = dist / shp.baseDist;
          shp.size = Math.max(20, defaultSize * scale);
        }
        mode = "TWO_HAND";
        drawShape(canvas, shp, true);
      }

      modeLabel.textContent = `MODE: ${mode}`;
      requestAnimationFrame(predict);
    }

    async function main() {
      await initHandLandmarker();
      await initCamera();
      requestAnimationFrame(predict);
    }

    main();
  </script>
</body>
</html>
